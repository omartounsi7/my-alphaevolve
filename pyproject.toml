# Describes this project to Python's packaging tools (pip, uv, ...)

[build-system]
# The tool that turns the src folder into an installable package
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "my-alphaevolve"
version = "0.1.0"
description = "A minimal, from-scratch implementation of the AlphaEvolve algorithm"
readme = "README.md"
requires-python = ">=3.10"
# Third-party packages the code needs to run
dependencies = [
    "openai>=1.0",  # talks to LLM servers that offer the OpenAI-compatible interface
]

[project.optional-dependencies]
# Tools needed only while developing; installed with: pip install -e ".[dev]"
dev = [
    "mypy>=1.10",  # type checker: finds type mistakes without running the code
    "ruff>=0.6",   # linter and formatter: finds common bugs and keeps the style uniform
    "numpy",       # imported by the examples' evaluation files, which are also loaded here
]

[tool.setuptools.package-data]
# The image definition DockerEvaluator builds from
my_alphaevolve = ["evaluation.Dockerfile"]

[tool.setuptools.packages.find]
# Tells setuptools that the package lives inside the src folder
where = ["src"]

[tool.mypy]
# The folders mypy checks when run with no arguments
# Each example is checked on its own (see the README): their files share names.
files = ["src", "scripts", "tests"]
# Where mypy finds the my_alphaevolve package when checking a single file
mypy_path = "src"
# Turn on every check, including "every function must have type hints"
strict = true
# Use mypy's pure-Python parser: Windows Application Control blocks the faster native one
native_parser = false

[tool.ruff]
# Maximum line length, for both the linter and the formatter
line-length = 100
# The oldest Python version the code must keep working on
target-version = "py310"

[tool.ruff.lint]
# Rule families to enforce:
#   E, W = style errors and warnings    F = real mistakes (unused or undefined names)
#   I    = import order                 B = common bug patterns
#   UP   = outdated syntax              N = naming conventions
select = ["E", "W", "F", "I", "B", "UP", "N"]
